# Local development: `docker compose up -d --build`
#   Website   http://localhost:3000
#   Dashboard http://localhost:3000/dashboard  (login: SEED_ADMIN_* in .env)
#   API       http://localhost:8080/api/v1/health
#   RustFS    http://localhost:9001/rustfs/console/
name: sonychristanto-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      target: dev
    env_file: .env
    environment:
      FRONTEND_REVALIDATE_URL: http://frontend:3000/_internal/revalidate
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./backend:/app
      - go_mod:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      NUXT_API_INTERNAL_URL: http://backend:8080
      NUXT_REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      NUXT_PUBLIC_SITE_URL: ${SITE_URL}
      NUXT_PUBLIC_GTM_ID: ${NUXT_PUBLIC_GTM_ID:-}
      NUXT_PUBLIC_SECURITY_CONTACT: ${SECURITY_CONTACT}
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:24678:24678" # Vite HMR websocket
    volumes:
      - ./frontend:/app
      - /app/node_modules # keep the container's Linux node_modules
      - /app/.nuxt
    depends_on:
      - backend

volumes:
  pg_data:
  rustfs_data:
  go_mod: